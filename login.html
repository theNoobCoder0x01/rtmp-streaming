<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to watch</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               padding: 24px; background: #f3f5f8; color: #182238;
               font: 16px system-ui, sans-serif; }
        main { width: 100%; max-width: 390px; padding: 32px; border: 1px solid #dde2eb;
               border-radius: 16px; background: white; box-shadow: 0 8px 32px #1822380a; }
        h1 { margin: 0 0 8px; font-size: 25px; }
        p { margin: 0 0 24px; color: #596579; line-height: 1.5; }
        label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 11px 12px; border: 1px solid #bac3d2;
                border-radius: 7px; font: inherit; }
        input:focus { outline: 2px solid #3365cf; outline-offset: 2px; }
        button { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 7px;
                 background: #2357ba; color: white; font: inherit; font-weight: 600; cursor: pointer; }
        button:hover { background: #194697; }
        .error { margin: 12px 0 0; color: #ac2424; font-size: 14px; }
        .note { margin: 20px 0 0; font-size: 13px; }
    </style>
</head>
<body>
    <main>
        <h1>Sign in to watch</h1>
        <p>Enter your viewer username and password.</p>
        <form method="post" action="/auth/login">
            <input type="hidden" name="return_to" value="{{return_to}}">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required autofocus maxlength="255">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <p class="error" role="alert">{{error}}</p>
            <button type="submit">Sign in</button>
        </form>
        <p class="note">Refreshing the page will ask you to sign in again.</p>
    </main>
</body>
</html>
