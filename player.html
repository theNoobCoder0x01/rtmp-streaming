<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Video Player</title>
    <link href="/public/video-js.css" rel="stylesheet" />
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .stream-selector {
            margin: 20px 0;
        }
        
        select {
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            min-width: 200px;
        }
        
        .video-container {
            margin-top: 20px;
        }
        
        .stream-info {
            margin-top: 10px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        
        .refresh-button {
            margin-left: 10px;
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #f8f8f8;
            cursor: pointer;
        }
        
        .refresh-button:hover {
            background-color: #e8e8e8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HLS Video Player</h1>
        
        <div class="stream-selector">
            <select id="streamSelect" onchange="changeStream()">
                <option value="">Select a stream...</option>
            </select>
            <button onclick="refreshStreams()" class="refresh-button">
                <span>↻</span> Refresh
            </button>
        </div>

        <div class="video-container">
            <video-js id="my-video" class="video-js vjs-default-skin" controls autoplay width="640" height="360">
                <!-- Source will be set dynamically -->
            </video-js>
        </div>

        <div class="stream-info" id="streamInfo">
            <!-- Stream information will be displayed here -->
        </div>
    </div>

    <script src="/public/video.min.js"></script>
    <script src="/public/videojs-contrib-hls.min.js"></script>

    <script>
        let player;
        let activeStreams = [];
        let ws;
        let selectedStreamId = null; // null means no initial selection yet.
        let playingStreamUrl = '';

        // Initialize Video.js player
        function initializePlayer() {
            player = videojs('my-video');
        }

        // Reuse options so status/refresh messages do not rebuild the dropdown.
        function updateStreamList(streams) {
            activeStreams = streams.filter(stream => stream.status === 'active');
            const select = document.getElementById('streamSelect');
            const streamIds = new Set(activeStreams.map(stream => stream.id));
            const optionsById = new Map(Array.from(select.options, option => [option.value, option]));

            // Keep the placeholder and remove only streams that went offline.
            for (let index = select.options.length - 1; index > 0; index--) {
                if (!streamIds.has(select.options[index].value)) {
                    select.remove(index);
                }
            }

            // Existing options keep their order, identity and selection.
            activeStreams.forEach(stream => {
                const label = `Stream ${stream.name} (${stream.quality})`;
                let option = optionsById.get(stream.id);
                if (!option) {
                    option = new Option(label, stream.id);
                    select.add(option);
                    optionsById.set(stream.id, option);
                } else if (option.text !== label) {
                    option.text = label;
                }
            });

            // Default only once, when the first active stream becomes available.
            if (selectedStreamId === null && activeStreams.length > 0) {
                selectedStreamId = activeStreams[0].id;
            }
            const nextValue = streamIds.has(selectedStreamId) ? selectedStreamId : '';
            if (select.value !== nextValue) {
                select.value = nextValue;
            }
            renderSelectedStream();
        }

        // Explicit choices (including the placeholder) override the default.
        function changeStream() {
            selectedStreamId = document.getElementById('streamSelect').value;
            renderSelectedStream();
        }

        function renderSelectedStream() {
            const stream = activeStreams.find(stream => stream.id === selectedStreamId);
            const nextUrl = stream ? `/hls/${stream.name}.m3u8` : '';

            // Metadata updates must not restart the current video.
            if (playingStreamUrl !== nextUrl) {
                playingStreamUrl = nextUrl;
                if (stream) {
                    player.src({ src: nextUrl, type: 'application/x-mpegURL' });
                    const playback = player.play();
                    // Browsers may require a click before playing with sound.
                    if (playback && typeof playback.catch === 'function') {
                        playback.catch(() => {});
                    }
                } else {
                    player.pause();
                    player.reset();
                }
            }

            if (stream) {
                document.getElementById('streamInfo').innerHTML = `
                    <h3>Stream Information</h3>
                    <p>Name: ${stream.name}</p>
                    <p>Quality: ${stream.quality}</p>
                    <p>Bandwidth In: ${stream.bandwidth_in.toFixed(2)} Mbps</p>
                    <p>Bandwidth Out: ${stream.bandwidth_out.toFixed(2)} Mbps</p>
                `;
            } else {
                document.getElementById('streamInfo').innerHTML = '';
            }
        }

        // WebSocket connection for stream updates
        function initializeWebSocket() {
            ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'status_update') {
                    updateStreamList(data.streams);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket connection closed. Attempting to reconnect...');
                setTimeout(initializeWebSocket, 5000);
            };
        }

        // Add this new function
        function refreshStreams() {
            // Send a message through WebSocket to request latest streams
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'request_status' }));
            }
        }

        // Initialize everything when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            initializePlayer();
            initializeWebSocket();
        });
    </script>
</body>
</html>
