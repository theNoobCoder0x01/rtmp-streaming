worker_processes 1; # RTMP statistics are per-worker; keep one consistent LAN view.
rtmp_auto_push on;
events {}

rtmp {
    server {
        listen 1935;
        application live {
            live on;
            notify_method post;
            on_publish http://127.0.0.1:8090/internal/rtmp/publish;
            on_publish_done http://127.0.0.1:8090/internal/rtmp/publish_done;
            on_play http://127.0.0.1:8090/internal/rtmp/play;
            on_play_done http://127.0.0.1:8090/internal/rtmp/play_done;
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_playlist_length 6s;
        }
    }
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The stream monitor polls this listener without a browser session.
    server {
        listen 127.0.0.1:8090;
        client_max_body_size 8k;
        location = /stat {
            rtmp_stat all;
        }
        location /internal/rtmp/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Internal-RTMP 1;
            proxy_set_header X-Forwarded-For 127.0.0.1;
            proxy_connect_timeout 1s;
            proxy_read_timeout 1s;
            proxy_send_timeout 1s;
            proxy_intercept_errors on;
            error_page 400 401 403 404 405 408 411 413 414 415 422 429 500 501 502 503 504 =200 @notification_fallback;
        }
        location @notification_fallback { return 200; }
        location / { return 404; }
    }

    server {
        listen 8080;
        server_name localhost;
        client_max_body_size 8k;

        location ^~ /internal/ { return 404; }

        # Every public HTTP request passes through the viewer session check.
        # Basic auth is intentionally absent: browsers cache its credentials.
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Internal-RTMP "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }

        # Only the authenticated application can redirect to these locations.
        # Nginx still sends video/static files without Python streaming them.
        location /_stream_hls/ {
            internal;
            alias /tmp/;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Cache-Control no-store always;
        }

        location /_stream_files/ {
            internal;
            alias /usr/local/nginx/html/;
        }

        location = /_stream_stats {
            internal;
            rtmp_stat all;
            rtmp_stat_stylesheet /stat.xsl;
        }
    }
}
